<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grammatik">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)">
<title>Grammatik Trainer</title>
<style>
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e2e0d9; --accent:#1d1d1f;
  --nom:#2563eb; --akk:#d9480f; --dat:#15803d; --verb:#b4124a; --inf:#7c3aed;
  --ok:#15803d; --okbg:#e7f5ec; --bad:#b91c1c; --badbg:#fdecec;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17171a; --card:#222226; --ink:#f1f1f3; --muted:#a0a0a8; --line:#35353b; --accent:#f1f1f3;
    --nom:#7aa7ff; --akk:#ff9463; --dat:#5fd08a; --verb:#ff7aa8; --inf:#b99bff;
    --ok:#5fd08a; --okbg:#17301f; --bad:#ff8a8a; --badbg:#3a1a1a; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
.flag{width:22px;height:15px;border-radius:2px;background:linear-gradient(#000 33%,#d00 33% 66%,#fc0 66%)}
.iconbtn{font-size:20px;line-height:1;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.iconbtn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card h4{margin:20px 0 6px;font-size:14px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.extile{text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:15px}
.extile span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.extile.done,.badge.done{border-color:var(--ok);background:var(--okbg)}
.extile.done span{color:var(--ok)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{min-width:40px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px}
.badge.done{color:var(--ok)}
.sol.small{font-size:16px;font-weight:500}
.card p{font-size:14px;margin:6px 0}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:20px}
.fields label{font-size:13px;font-weight:600}
.fields input{display:block;width:100%;min-width:0;margin-top:4px}
input[type=text].right{border-color:var(--ok);background:var(--okbg)} input[type=text].wrong{border-color:var(--bad);background:var(--badbg)}
nav{margin-bottom:14px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--ink);cursor:pointer;font-size:15px;line-height:1.25}
nav button b{flex:1}
nav button span{font-size:13px;color:var(--muted);white-space:nowrap}
nav .topic{border-radius:12px;padding:13px 16px;font-size:17px}
nav .topic i{font-style:normal;color:var(--muted);transition:transform .15s}
nav .topic[aria-expanded=true] i{transform:rotate(180deg)}
nav .menu{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);display:grid;grid-template-columns:1fr 1fr}
nav .menu button{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px}
nav .menu button.on{background:var(--bg);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
nav .menu button.done span{color:var(--ok)}
@media (max-width:560px){nav .menu{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.chips small{color:var(--muted);margin-right:4px;min-width:42px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.chip.N.on{background:var(--nom);border-color:var(--nom);color:#fff}
.chip.A.on{background:var(--akk);border-color:var(--akk);color:#fff}
.chip.D.on{background:var(--dat);border-color:var(--dat);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px;margin-top:12px}
.tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.prompt{font-size:24px;font-weight:600;line-height:1.35}
.sub{color:var(--muted);margin-top:6px}
.prompt.letter{font-size:16px;font-weight:400;line-height:1.6;white-space:pre-line;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.prompt.letter .gap{min-width:80px}
.opts.box .opt{font-size:15px;padding:8px 12px}
.gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--muted);text-align:center;color:var(--muted)}
.gap.filled{border-color:var(--ok);color:var(--ok)}
.row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:160px;font-size:20px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font-size:16px;padding:10px 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.group{margin-top:18px}
.group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-size:17px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.line{margin-top:18px;min-height:54px;padding:8px;border:1px dashed var(--line);border-radius:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:18px}
.line .pre{color:var(--muted);padding:0 4px}
.bank{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px;min-height:44px}
.tile{font-size:18px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.tile.locked{cursor:default;opacity:.7}
.fb{margin-top:20px;padding:14px 16px;border-radius:10px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)}
.fb h3{margin:0 0 4px;font-size:16px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.sol{font-size:19px;font-weight:600;margin:4px 0}
.fb p{margin:6px 0 0;font-size:14px}
.N{color:var(--nom)} .A{color:var(--akk)} .D{color:var(--dat)}
.v{color:var(--verb);font-weight:700;text-decoration:underline} .inf{color:var(--inf);font-weight:700}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:14px}
details{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ref{overflow-x:auto}
@media (max-width:560px){.ref th,.ref td{padding:5px 6px} .ref th{font-size:10px;letter-spacing:0}}
.ref p{font-size:14px;margin:8px 0}
.ref h4{margin:16px 0 4px;font-size:14px}
.schema{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 12px;font-size:14px}
.schema span{border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.schema .v,.schema .inf{text-decoration:none;border-color:currentColor}

/* ---------- playful theme: bright colours, chunky buttons with a pressable 3D edge ---------- */
:root{
  --bg:#fff; --bg2:#f7f7f7; --card:#fff; --ink:#3c3c3c; --muted:#777; --line:#e5e5e5; --accent:#1cb0f6;
  --pri:#58cc02; --pri-d:#58a700; --pri-ink:#fff;
  --blue:#1cb0f6; --blue-bg:#ddf4ff; --blue-line:#84d8ff;
  --ok:#58a700; --okbg:#d7ffb8; --okline:#a5ed6e; --bad:#ea2b2b; --badbg:#ffdfe0; --badline:#ffb2b2;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131f24; --bg2:#202f36; --card:#131f24; --ink:#f1f7fb; --muted:#9fb0ba; --line:#37464f; --accent:#49c0f8;
    --pri:#93d333; --pri-d:#79b933; --pri-ink:#131f24;
    --blue:#49c0f8; --blue-bg:#202f36; --blue-line:#3f85a7;
    --ok:#93d333; --okbg:#202f36; --okline:#5f8428; --bad:#ee5555; --badbg:#202f36; --badline:#a33; }
}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
h1{font-weight:800}
.card{border-width:2px;border-radius:18px}
.tag{font-weight:700}
.prompt{font-weight:700}

/* shared shape: 2px outline + a solid edge underneath that disappears when pressed */
.btn,.opt,.tile,.extile,.badge,.chip,.iconbtn,nav .topic{border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:700;
  box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s,filter .1s}
:is(.btn,.opt,.tile,.extile,.badge,.chip,.iconbtn,nav .topic):not(:disabled):not(.locked):active{transform:translateY(3px);box-shadow:0 0 0 transparent}

.btn{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 4px 0 var(--pri-d);text-transform:uppercase;letter-spacing:.04em;font-size:15px;font-weight:800;padding:12px 22px}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.btn:not(:disabled):active{transform:translateY(4px)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);box-shadow:none;opacity:1}
.btn.ghost{background:var(--card);border-color:var(--line);color:var(--blue);box-shadow:0 3px 0 var(--line)}

.opt{padding:11px 18px}
.opt.sel{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue);box-shadow:0 3px 0 var(--blue-line)}
.opt.right{background:var(--okbg);border-color:var(--okline);color:var(--ok);box-shadow:0 3px 0 var(--okline)}
.opt.wrong{background:var(--badbg);border-color:var(--badline);color:var(--bad);box-shadow:0 3px 0 var(--badline)}
.tile{border-radius:12px;padding:8px 14px}
.tile:disabled{box-shadow:none}
.line{border:2px solid var(--line);border-style:solid none;border-radius:0;padding:10px 2px 13px}
.bank{gap:8px;padding-bottom:4px}

.extile{padding:12px 14px}
.extile:not(.done) b{color:var(--blue)}
.extile.done,.badge.done{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 3px 0 var(--pri-d)}
.extile.done span,.extile.done span *{color:var(--pri-ink)}
.exgrid{gap:10px 8px}
.badge{border-radius:10px}
.chip{color:var(--blue);text-transform:uppercase;letter-spacing:.04em;font-size:12px;font-weight:800;padding:7px 14px}
.chips{margin-bottom:12px}
.iconbtn.on{border-color:var(--blue-line);background:var(--blue-bg);box-shadow:0 3px 0 var(--blue-line)}

nav .topic{border-radius:16px}
nav .topic b{font-weight:800}
nav .topic i{color:var(--blue)}
nav .topic span,nav .menu button span{font-weight:700}
nav .menu{border-width:2px;border-radius:16px}
nav .menu button{border-bottom-width:2px}
nav .menu button.on{background:var(--blue-bg);color:var(--blue);box-shadow:none}
nav .menu button.on span{color:var(--blue)}

input[type=text]{border-width:2px;border-radius:12px;background:var(--bg2)}
input[type=text]:focus{outline:none;border-color:var(--blue)}
input[type=text].right{border-color:var(--okline)} input[type=text].wrong{border-color:var(--badline)}
.fb{border-radius:14px}
.fb h3{font-size:18px;font-weight:800}
details{border-width:2px;border-radius:18px}
details.exgroup{margin:10px 0 0;padding:0;border:0;border-radius:0;border-top:2px solid var(--line)}
.exgroup summary{display:flex;align-items:center;gap:10px;padding:14px 2px;list-style:none;font-weight:800}
.exgroup summary::-webkit-details-marker{display:none}
.exgroup summary::before{content:'▸';color:var(--blue);transition:transform .15s}
.exgroup[open] summary::before{transform:rotate(90deg)}
.exgroup summary b{flex:1}
.exgroup summary span{font-size:13px;color:var(--muted)}
.exgroup.done summary span{color:var(--ok)}
.exgroup .exgrid{padding-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="flag"></span>Grammatik Trainer</h1>
    <button class="iconbtn" id="profileBtn" aria-label="Profil">👤</button>
  </header>
  <div id="main">
    <nav id="nav"></nav>
    <div id="controls"></div>
    <div class="card" id="card"></div>
    <details id="refbox"><summary>Tabelle</summary><div class="ref" id="ref"></div></details>
  </div>
  <div id="profile" hidden></div>
</div>

<script>
// ---------- helpers ----------
const $ = s => document.querySelector(s);
let RNG = Math.random;
const rnd = a => a[Math.floor(RNG() * a.length)];
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const sshuffle = (a, seed) => { const r = mulberry(seed); a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
const cap = s => s[0].toUpperCase() + s.slice(1);
const CASE = { N: 'Nominativ', A: 'Akkusativ', D: 'Dativ' };
const cspan = (c, t) => `<span class="${c}">${t}</span>`;

// ---------- 1. Personalpronomen ----------
const PRON = [
  { n: 'ich', a: 'mich', d: 'mir', lab: 'ich' },
  { n: 'du', a: 'dich', d: 'dir', lab: 'du' },
  { n: 'er', a: 'ihn', d: 'ihm', lab: 'er' },
  { n: 'sie', a: 'sie', d: 'ihr', lab: 'sie (she)' },
  { n: 'es', a: 'es', d: 'ihm', lab: 'es' },
  { n: 'wir', a: 'uns', d: 'uns', lab: 'wir' },
  { n: 'ihr', a: 'euch', d: 'euch', lab: 'ihr (you all)' },
  { n: 'sie', a: 'sie', d: 'ihnen', lab: 'sie (they)' },
  { n: 'Sie', a: 'Sie', d: 'Ihnen', lab: 'Sie (formal)' },
];
const pronRow = p => `${cspan('N', p.n)} → ${cspan('A', p.a)} → ${cspan('D', p.d)}`;
const pronQ = p => ({ tag: 'Personalpronomen', key: p.lab, prompt: p.lab, kind: 'inputs', solution: pronRow(p),
    fields: [{ label: 'Akkusativ', cls: 'A', answer: p.a }, { label: 'Dativ', cls: 'D', answer: p.d }] });

// ---------- 2. Possessivartikel ----------
const OWNERS = [['ich', 'mein'], ['du', 'dein'], ['er', 'sein'], ['sie (she)', 'ihr'], ['es', 'sein'], ['wir', 'unser'], ['ihr (you all)', 'euer'], ['sie (they)', 'ihr'], ['Sie (formal)', 'Ihr']];
const ENDING = { N: { m: '', f: 'e', n: '', p: 'e' }, A: { m: 'en', f: 'e', n: '', p: 'e' }, D: { m: 'em', f: 'er', n: 'em', p: 'en' } };
const GENDER = { m: 'maskulin', f: 'feminin', n: 'neutral', p: 'Plural' };
const ART = { m: 'der', f: 'die', n: 'das', p: 'die' };
const poss = (stem, c, g) => { const e = ENDING[c][g]; return (stem === 'euer' && e ? 'eur' : stem) + e; };
const NOUNS = [
  ['m', 'Hund'], ['m', 'Bruder'], ['m', 'Vater'], ['m', 'Freund'], ['m', 'Computer'], ['m', 'Schlüssel'],
  ['f', 'Katze'], ['f', 'Schwester'], ['f', 'Mutter'], ['f', 'Tasche'], ['f', 'Freundin'],
  ['n', 'Auto'], ['n', 'Buch'], ['n', 'Kind'], ['n', 'Haus'], ['n', 'Fahrrad'],
  ['p', 'Kinder', 'Kindern'], ['p', 'Eltern', 'Eltern'], ['p', 'Freunde', 'Freunden'], ['p', 'Bücher', 'Büchern'], ['p', 'Schuhe', 'Schuhen'],
];
const POSS_FR = {
  N: [['Das ist ___ {n}.', 'Das sind ___ {n}.', 'Das ist/sind … → Nominativ'], ['Wo ist ___ {n}?', 'Wo sind ___ {n}?', 'Subjekt → Nominativ'], ['___ {n} ist nicht hier.', '___ {n} sind nicht hier.', 'Subjekt → Nominativ']],
  A: [['Anna sucht ___ {n}.', 0, 'suchen + Akkusativ'], ['Paul mag ___ {n}.', 0, 'mögen + Akkusativ'], ['Das ist für ___ {n}.', 0, 'für + Akkusativ'], ['Siehst du ___ {n}?', 0, 'sehen + Akkusativ']],
  D: [['Paul spricht von ___ {n}.', 0, 'von + Dativ'], ['Anna erzählt von ___ {n}.', 0, 'von + Dativ'], ['Was ist mit ___ {n} passiert?', 0, 'mit + Dativ'], ['Paul träumt von ___ {n}.', 0, 'von + Dativ']],
};
function genPossSentence(cases) {
  const c = rnd(cases), [lab, stem] = rnd(OWNERS), [g, noun, datPl] = rnd(NOUNS), [sg, pl, why] = rnd(POSS_FR[c]);
  const word = c === 'D' && g === 'p' ? datPl : noun;
  const t = (g === 'p' && pl ? pl : sg).replace('{n}', word), a = poss(stem, c, g);
  return { tag: 'Possessivartikel · Satz', prompt: t, sub: `Besitzer: <b>${lab}</b> · ${ART[g]} ${noun} (${GENDER[g]})`, kind: 'input', answer: [a],
    show: t.startsWith('___') ? cap(a) : a,
    explain: `${why} → ${cspan(c, CASE[c])} · ${GENDER[g]} → <b>${stem === 'euer' ? 'eu(e)r' : stem}-${ENDING[c][g] || '∅'}</b>` +
      (c === 'D' && g === 'p' ? '<br>Dativ Plural: the noun also gets <b>-n</b>.' : '') };
}
function possTableQ([c, [lab, stem], g]) {
  const a = poss(stem, c, g);
  return { tag: 'Possessivartikel · Tabelle', prompt: `${lab} · ${cspan(c, CASE[c])} · ${GENDER[g]}`, sub: `${stem}- + ?`, kind: 'input', answer: [a], show: a,
    explain: `${cspan(c, CASE[c])} ${GENDER[g]} → Endung <b>-${ENDING[c][g] || '∅'}</b>` + (stem === 'euer' && ENDING[c][g] ? ' · euer loses its e: <b>eur-</b>' : '') };
}
function possEndQ([c, g]) {
  const e = ENDING[c][g] || '∅ (no ending)';
  return { tag: 'Possessivartikel · Endung', prompt: `${cspan(c, CASE[c])} · ${GENDER[g]}`, sub: 'Which ending? (mein__)', kind: 'multi',
    groups: [{ options: ['∅ (no ending)', 'e', 'en', 'em', 'er'], answer: e }], explain: `mein → <b>${poss('mein', c, g)}</b> (same endings as ein / kein)` };
}

// ---------- 3. Präpositionen & Verbergänzungen ----------
const VP = `warten|auf|A|to wait for|Ich warte ___ den Bus.
sich freuen|auf|A|to look forward to|Ich freue mich ___ den Urlaub.
sich freuen|über|A|to be happy about|Sie freut sich ___ das Geschenk.
denken|an|A|to think of|Ich denke oft ___ dich.
sich erinnern|an|A|to remember|Erinnerst du dich ___ den Film?
sich interessieren|für|A|to be interested in|Er interessiert sich ___ Musik.
sich kümmern|um|A|to take care of|Sie kümmert sich ___ die Kinder.
sprechen|mit|D|to talk with|Ich spreche ___ meinem Chef.
sprechen|über|A|to talk about|Wir sprechen ___ das Problem.
träumen|von|D|to dream of|Er träumt ___ einem Haus am Meer.
teilnehmen|an|D|to take part in|Ich nehme ___ der Konferenz teil.
Angst haben|vor|D|to be afraid of|Das Kind hat Angst ___ dem Hund.

const PREPS = ['an', 'auf', 'bei', 'für', 'in', 'mit', 'nach', 'über', 'um', 'unter', 'von', 'vor', 'zu'];

// prepositions that would ALSO make a correct sentence — never offered as wrong options
const VP_EXCL = { 'sich freuen|auf': ['über'], 'sich freuen|über': ['auf'], 'denken|an': ['über'], 'sprechen|mit': ['von', 'vor', 'zu'],
  'träumen|von': ['in', 'unter'], 'sich bewerben|um': ['für', 'auf'], 'sich treffen|mit': ['bei', 'vor'], 'sich vorbereiten|auf': ['für'],
  'anfangen|mit': ['nach', 'vor', 'bei'], 'erzählen|von': ['nach', 'vor'], 'helfen|bei': ['mit', 'nach', 'vor'], 'schmecken|nach': ['mit'],
  'streiten|mit': ['vor'], 'telefonieren|mit': ['bei', 'von'], 'leiden|unter': ['an'] };
function vpQ([verb, prep, c, en, s]) {
  const excl = VP_EXCL[verb + '|' + prep] || [];
  const opts = shuffle([prep, ...shuffle(PREPS.filter(p => p !== prep && !excl.includes(p))).slice(0, 4)]);
  return { tag: 'Verb + Präposition', key: verb + prep, prompt: s, sub: `<b>${verb}</b> — ${en}`, kind: 'multi', fill: prep,
    groups: [{ label: 'Präposition', options: opts, answer: prep }, { label: 'Kasus danach', options: ['Akkusativ', 'Dativ'], answer: CASE[c] }],
    explain: `<b>${verb} ${prep}</b> + ${cspan(c, CASE[c])}` };
}

// split a fixed list into exercises of about `size` items — the same split every time
function split(list, size, seed) {
  const a = sshuffle(list, seed), n = Math.ceil(a.length / size), out = [];
  for (let i = 0; i < n; i++) out.push(a.slice(Math.round(i * a.length / n), Math.round((i + 1) * a.length / n)));
  return out;
}
const group = (id, label, lists, toQ) => lists.map((items, i) => ({ id: `${id}-${i + 1}`, label, make: () => items.map(toQ) }));
// n distinct questions from a random generator, reproducible via the seed
function seededSet(gen, n, seed) {
  RNG = mulberry(seed);
  try { const out = [], seen = new Set(); for (let i = 0; out.length < n && i < 300; i++) { const q = gen(); if (!seen.has(q.prompt + q.sub)) { seen.add(q.prompt + q.sub); out.push(q); } } return out; }
  finally { RNG = Math.random; }
}

let cur = null;
const save = () => store.set({ f: state.f, done: state.done, mute: state.mute, fold: state.fold });
const feat = () => FEATURES[state.f];
const doneCount = F => F.ex.filter(e => state.done[e.id]).length;

// ---------- sound ----------
// The sounds are synthesised once into small WAV files and played with <audio> elements. Unlike Web Audio,
// these keep working on iPhones after the app was in the background, and they also play in silent mode.
function wavUrl(notes) {
  const rate = 22050, len = Math.ceil(rate * (Math.max(...notes.map(n => n.at + n.dur)) + 0.02)), pcm = new Float32Array(len);
  const wave = { sine: x => Math.sin(x), triangle: x => 2 / Math.PI * Math.asin(Math.sin(x)), square: x => Math.sin(x) >= 0 ? 1 : -1 };
  for (const n of notes) {
    const start = Math.floor(n.at * rate), count = Math.floor(n.dur * rate);
    for (let i = 0; i < count && start + i < len; i++) {
      const t = i / rate, attack = Math.min(1, t / 0.004);                  // 4 ms fade-in avoids a click
      pcm[start + i] += wave[n.type || 'sine'](2 * Math.PI * n.f * t) * n.vol * attack * Math.pow(0.0005, t / n.dur);
    }
  }
  const buf = new DataView(new ArrayBuffer(44 + len * 2)), str = (o, t) => [...t].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); buf.setUint32(4, 36 + len * 2, true); str(8, 'WAVEfmt '); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
  buf.setUint32(24, rate, true); buf.setUint32(28, rate * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); str(36, 'data'); buf.setUint32(40, len * 2, true);
  pcm.forEach((v, i) => buf.setInt16(44 + i * 2, Math.max(-1, Math.min(1, v)) * 32767, true));
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
const SOUND_NOTES = {
  tap: [{ f: 520, at: 0, dur: 0.06, type: 'triangle', vol: 0.35 }],
  ok: [{ f: 660, at: 0, dur: 0.14, vol: 0.45 }, { f: 880, at: 0.1, dur: 0.24, vol: 0.45 }],
  bad: [{ f: 220, at: 0, dur: 0.13, type: 'square', vol: 0.16 }, { f: 165, at: 0.11, dur: 0.24, type: 'square', vol: 0.16 }],
};
let players = null; // per sound a few <audio> elements, so quick taps can overlap
function sfx(name) {
  if (state.mute) return;
  try {
    if (!players) {
      // iOS 17+: treat this as media playback (plays even when the ring/silent switch is on)
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
      players = {};
      for (const [k, notes] of Object.entries(SOUND_NOTES)) { const url = wavUrl(notes); players[k] = [0, 1, 2].map(() => { const a = new Audio(url); a.preload = 'auto'; return a; }); }
    }
    const a = players[name].find(x => x.paused || x.ended) || players[name][0];
    a.currentTime = 0;
    const p = a.play(); if (p) p.catch(() => {});
  } catch {}
}

// ---------- rendering ----------
// no fill: every gap is shown empty (some sentences have two) · fill: the first gap is filled in
const gapHtml = (t, fill) => fill ? t.replace('___', `<span class="gap filled">${fill}</span>`) : t.replace(/___/g, '<span class="gap">&nbsp;</span>');
const noteHtml = e => e.note ? (CASE[e.note] ? cspan(e.note, CASE[e.note]) : e.note) : '';
function renderNav() {
  // one compact topic button; the full topic list (with progress) opens on tap
  const F = feat(), prog = G => `${doneCount(G)} / ${G.ex.length}${doneCount(G) === G.ex.length ? ' ✓' : ''}`;
  $('#nav').innerHTML = `<button class="topic" id="topicBtn" aria-expanded="${!!state.menu}"><b>${F.title}</b><span>${prog(F)}</span><i>▾</i></button>` +
    (state.menu ? `<div class="menu">` + FEATURES.map((G, i) => `<button class="${i === state.f ? 'on' : ''} ${doneCount(G) === G.ex.length ? 'done' : ''}" data-f="${i}"><b>${G.title}</b><span>${prog(G)}</span></button>`).join('') + '</div>' : '');
  $('#ref').innerHTML = REF[feat().id]();
}

// exercise picker for the current tab
function showList() {
  state.ex = null; state.round = null; cur = null;
  renderNav(); $('#controls').innerHTML = '';
  const F = feat(), groups = [];
  F.ex.forEach((e, i) => { const g = groups[groups.length - 1]; if (g && g.label === e.label) g.items.push([e, i]); else groups.push({ label: e.label, items: [[e, i]] }); });
  // each group folds; a finished group starts folded unless the user opened it (state.fold remembers their choice)
  $('#card').innerHTML = `<div class="tag">${doneCount(F)} / ${F.ex.length} erledigt</div>` + groups.map(g => {
    const n = g.items.filter(([e]) => state.done[e.id]).length, all = n === g.items.length, key = F.id + '|' + g.label;
    const open = key in state.fold ? state.fold[key] : !all;
    return `<details class="exgroup ${all ? 'done' : ''}" data-key="${key}" ${open ? 'open' : ''}><summary><b>${g.label}</b><span>${n} / ${g.items.length}${all ? ' ✓' : ''}</span></summary><div class="exgrid">` +
      g.items.map(([e, i]) => { const d = state.done[e.id];
        return `<button class="extile ${d ? 'done' : ''}" data-ex="${i}"><b>Übung ${e.n}</b><span>${[noteHtml(e), d ? `✓ ${d.best} / ${d.total}` : ''].filter(Boolean).join(' · ') || '&nbsp;'}</span></button>`; }).join('') + '</div></details>';
  }).join('');
}
// remember only what the user folds or opens by hand (the click arrives before the group toggles)
document.addEventListener('click', e => {
  const sum = e.target.closest('.exgroup > summary'); if (!sum) return;
  const d = sum.parentElement; state.fold[d.dataset.key] = !d.open; save(); sfx('tap');
});
function startExercise(i) {
  state.ex = feat().ex[i]; state.menu = false; renderNav();
  const d = state.ex.ordered ? state.ex.make() : shuffle(state.ex.make()); // letters keep their reading order
  state.round = { queue: d, total: d.length, asked: 0, right: 0, missed: [] };
  $('#controls').innerHTML = `<div class="chips"><button class="chip" id="toList">← Übungen</button></div>`;
  next();
}
function next() {
  const r = state.round;
  if (!r.queue.length) return showSummary();
  const q = r.queue.shift();
  q.progress = q.isRetry ? `Wiederholung · noch ${r.queue.length + 1}` : `${++r.asked} / ${r.total}`;
  showQuestion(q);
}
// the right answer as one line, for the result screen
function solText(q) {
  if (q.solution) return q.solution;
  if (q.kind === 'input') return gapHtml(q.prompt, q.show).replace('gap filled', '');
  if (q.kind === 'build') return (q.pre ? q.pre + ' ' : '') + q.tiles.map(t => t.role ? `<span class="${t.role}">${t.t}</span>` : t.t).join(' ') + q.end;
  return (q.fill ? q.prompt.replace('___', `<b>${q.fill}</b>`) : q.prompt) + ' → ' + q.groups.map(g => g.answer).filter(a => a !== q.fill).join(', ');
}
function showSummary() {
  const r = state.round, e = state.ex, F = feat(), prev = state.done[e.id];
  state.done[e.id] = { best: Math.max(prev ? prev.best : 0, r.right), total: r.total }; save(); renderNav();
  cur = { summary: true, done: true, q: {} };
  const hasNext = e.n < F.ex.length;
  $('#card').innerHTML = `<div class="tag">${F.title}</div><div class="prompt">Übung ${e.n} erledigt ✓</div>
    <div class="sub">${r.right} / ${r.total} beim ersten Versuch${r.right === r.total ? ' 🎉' : ''}</div>` +
    (r.missed.length ? `<h4>Noch üben</h4>` + r.missed.map(q => `<div class="sol small">${solText(q)}</div>`).join('') : '') +
    `<div class="row">${hasNext ? `<button class="btn" id="nextEx">Übung ${e.n + 1} →</button>` : ''}<button class="btn ${hasNext ? 'ghost' : ''}" id="again">Noch einmal</button><button class="btn ghost" id="toList">Übungen</button></div>`;
  ($('#nextEx') || $('#again')).focus();
}

function showQuestion(q) {
  cur = { q, done: false, sel: [], placed: [], bank: [] };
  let h = `<div class="tag">Übung ${state.ex.n} · ${q.progress}</div><div class="prompt${q.cls ? ' ' + q.cls : ''}" id="prompt">${gapHtml(q.prompt)}</div>`;
  if (q.sub) h += `<div class="sub">${q.sub}</div>`;
  const inp = id => `<input type="text" id="${id}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
  if (q.kind === 'input') {
    h += `<div class="row">${inp('ans')}<button class="btn" id="check">Prüfen</button></div>`;
  } else if (q.kind === 'inputs') {
    h += `<div class="fields">` + q.fields.map((f, i) => `<label class="${f.cls}">${f.label}${inp('ans' + i)}</label>`).join('') +
      `</div><div class="row"><button class="btn" id="check">Prüfen</button></div>`;
  } else if (q.kind === 'multi') {
    h += q.groups.map((g, gi) => `<div class="group">${g.label ? `<label>${g.label}</label>` : ''}<div class="opts${g.box ? ' box' : ''}">` +
      g.options.map((o, oi) => `<button class="opt" data-g="${gi}" data-o="${oi}">${o}</button>`).join('') + '</div></div>').join('');
  } else {
    const idx = q.tiles.map((_, i) => i);
    if (q.lock) cur.placed = [0];
    let bank = idx.filter(i => !cur.placed.includes(i));
    do { bank = shuffle(bank); } while (bank.length > 1 && bank.every((v, i) => i === 0 || v > bank[i - 1]));
    cur.bank = bank;
    h += `<div class="line" id="line"></div><div class="bank" id="bank"></div><div class="row"><button class="btn" id="check" disabled>Prüfen</button><button class="btn ghost" id="clear">Zurücksetzen</button></div>`;
  }
  h += `<div id="fb"></div>`;
  $('#card').innerHTML = h;
  if (q.kind === 'build') drawBuild();
  const a = $('#ans') || $('#ans0'); if (a) a.focus();
}

function drawBuild() {
  const q = cur.q, dis = cur.done ? 'disabled' : '';
  $('#line').innerHTML = (q.pre ? `<span class="pre">${q.pre}</span>` : '') +
    cur.placed.map(i => `<button class="tile ${q.lock && i === 0 ? 'locked' : ''}" data-p="${i}" ${dis}>${q.tiles[i].t}</button>`).join('') + `<span class="pre">${q.end}</span>`;
  $('#bank').innerHTML = cur.bank.map(i => `<button class="tile" data-b="${i}" ${dis}>${q.tiles[i].t}</button>`).join('');
  $('#check').disabled = cur.done || cur.bank.length > 0;
}

function finish(ok, solution) {
  const q = cur.q, r = state.round; cur.done = true;
  if (!ok) { r.queue.push({ ...q, isRetry: true }); if (!q.isRetry) r.missed.push(q); }
  else if (!q.isRetry) r.right++;
  sfx(ok ? 'ok' : 'bad');
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><h3>${ok ? 'Richtig! ✓' : 'Leider falsch ✗'}</h3>` +
    (solution ? `<div class="sol">${solution}</div>` : '') + `<p>${q.explain || ''}</p></div><div class="row"><button class="btn" id="next">Weiter →</button></div>`;
  document.querySelectorAll('#card .opt, #card input, #check, #clear').forEach(e => e.disabled = true);
  $('#next').focus();
}

function check() {
  if (!cur || cur.done) return;
  const q = cur.q;
  if (q.kind === 'input') {
    const v = norm($('#ans').value); if (!v) return;
    const ok = q.answer.some(a => norm(a) === v);
    $('#prompt').innerHTML = gapHtml(q.prompt, q.show);
    finish(ok, ok ? '' : solText(q));
  } else if (q.kind === 'inputs') {
    const els = q.fields.map((_, i) => $('#ans' + i));
    const empty = els.find(e => !norm(e.value)); if (empty) { empty.focus(); return; }
    let ok = true;
    q.fields.forEach((f, i) => { const r = (f.alts || [f.answer]).some(a => norm(a) === norm(els[i].value)); if (!r) ok = false; els[i].classList.add(r ? 'right' : 'wrong'); });
    finish(ok, q.solution);
  } else if (q.kind === 'multi') {
    if (q.groups.some((_, gi) => cur.sel[gi] == null)) return;
    let ok = true;
    q.groups.forEach((g, gi) => {
      const right = g.options.indexOf(g.answer);
      if (cur.sel[gi] !== right) ok = false;
      document.querySelectorAll(`.opt[data-g="${gi}"]`).forEach((b, oi) => {
        if (oi === right) b.classList.add('right'); else if (oi === cur.sel[gi]) b.classList.add('wrong');
      });
    });
    if (q.fill) $('#prompt').innerHTML = gapHtml(q.prompt, q.fill);
    finish(ok, '');
  } else {
    if (cur.bank.length) return;
    const ok = cur.placed.map(i => q.tiles[i].t).join(' ') === q.tiles.map(t => t.t).join(' ');
    cur.done = true; drawBuild();
    finish(ok, solText(q));
  }
}

// ---------- profile ----------
function renderProfile() {
  const blocks = FEATURES.map((F, fi) => `<h4>${F.title} — ${doneCount(F)} / ${F.ex.length} erledigt</h4><div class="badges">` +
    F.ex.map((e, i) => { const d = state.done[e.id]; return `<button class="badge ${d ? 'done' : ''}" data-jump="${fi},${i}" title="${e.label}">${e.n}${d ? ' ✓' : ''}</button>`; }).join('') + '</div>').join('');
  $('#profile').innerHTML = `<div class="card"><div class="tag">Profil</div>${blocks}
    <h4>Einstellungen</h4><div class="row" style="margin-top:8px"><button class="btn ghost" id="mute">${state.mute ? '🔇 Ton aus' : '🔊 Ton an'}</button><button class="btn ghost" id="reset">Fortschritt zurücksetzen</button></div>
    <h4>Tipps</h4><p>Each exercise asks every question once; mistakes are asked again at the end. ✓ = finished — tap a number to open that exercise.</p>
    <p>Keyboard: <kbd>Enter</kbd> checks / goes on · <kbd>1</kbd>–<kbd>5</kbd> pick an option.</p>
    <p>Colours: ${cspan('N', 'Nominativ')} · ${cspan('A', 'Akkusativ')} · ${cspan('D', 'Dativ')} · <span class="v">konjugiertes Verb</span> · <span class="inf">Infinitiv</span></p>
    <div class="row"><button class="btn" id="back">← Zurück</button></div></div>`;
}
function toggleProfile(open) {
  $('#profile').hidden = !open; $('#main').hidden = open; $('#profileBtn').classList.toggle('on', open);
  if (open) renderProfile(); else if (!state.ex) showList();
}

// ---------- events ----------
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled || b.classList.contains('locked')) return;
  const d = b.dataset, wasDone = cur && cur.done;
  if (b.id === 'profileBtn') toggleProfile($('#profile').hidden);
  else if (b.id === 'back') toggleProfile(false);
  else if (b.id === 'mute') { state.mute = !state.mute; save(); renderProfile(); }
  else if (b.id === 'reset') { if (!confirm('Fortschritt wirklich zurücksetzen?')) return; state.done = {}; state.fold = {}; save(); renderProfile(); }
  else if (d.jump) { const [f, i] = d.jump.split(',').map(Number); state.f = f; save(); state.ex = FEATURES[f].ex[i]; toggleProfile(false); renderNav(); startExercise(i); }
  else if (b.id === 'topicBtn') { state.menu = !state.menu; renderNav(); }
  else if (d.f != null) { state.f = +d.f; state.menu = false; save(); showList(); }
  else if (d.ex != null) startExercise(+d.ex);
  else if (b.id === 'toList') showList();
  else if (b.id === 'nextEx') startExercise(state.ex.n);
  else if (b.id === 'again') startExercise(state.ex.n - 1);
  else if (b.id === 'check') check();
  else if (b.id === 'next') next();
  else if (b.id === 'clear') { const keep = cur.q.lock ? [0] : []; cur.bank = [...cur.bank, ...cur.placed.filter(i => !keep.includes(i))]; cur.placed = keep; drawBuild(); }
  else if (d.g != null && !cur.done) pick(+d.g, +d.o);
  else if (d.b != null && !cur.done) { const i = +d.b; cur.bank = cur.bank.filter(x => x !== i); cur.placed.push(i); drawBuild(); }
  else if (d.p != null && !cur.done) { const i = +d.p; cur.placed = cur.placed.filter(x => x !== i); cur.bank.push(i); drawBuild(); }
  if (!(cur && cur.done && !wasDone)) sfx('tap'); // the right/wrong sound already played when a click finished the question
});
function pick(gi, oi) {
  cur.sel[gi] = oi;
  document.querySelectorAll(`.opt[data-g="${gi}"]`).forEach((b, i) => b.classList.toggle('sel', i === oi));
  check(); // only fires once every group has a selection
}
document.addEventListener('keydown', e => {
  if (!cur || !$('#profile').hidden) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    if (cur.summary) { sfx('tap'); state.ex.n < feat().ex.length ? startExercise(state.ex.n) : showList(); }
    else if (cur.done) { sfx('tap'); next(); }
    else check();
  } else if (cur.q.kind === 'multi' && !cur.done && /^[1-9]$/.test(e.key)) {
    const gi = cur.q.groups.findIndex((_, i) => cur.sel[i] == null), oi = +e.key - 1;
    if (gi >= 0 && oi < cur.q.groups[gi].options.length) pick(gi, oi);
  }
});

showList();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
